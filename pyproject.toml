[project]
name = "intelligent-work-assistant"
version = "0.2.1"
description = "Personal Intelligent Work Assistant running on local computer"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "chromadb>=1.3.5",
    "modelscope>=1.31.0",
    "openvino>=2025.3.0",
    "openvino-genai>=2025.3.0.0",
    "optimum[openvino]>=2.0.0",
    "streamlit>=1.50.0",
]

[project.urls]
Homepage = "https://github.com/guominjia/intelligent-work-assistant"
Repository = "https://github.com/guominjia/intelligent-work-assistant.git"
Issues = "https://github.com/guominjia/intelligent-work-assistant/issues"

[project.scripts]
iwa = "intelligent_work_assistant.main:main"